</head><body>
<style>
:root{
  
  --bg:#f3f5f6;--panel:#ffffff;--ink:#14212b;--muted:#566472;--line:#d6dde2;
  --accent:#0f8a7e;--accent-2:#c86a12;--lp:#c0392b;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;--f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161c;--panel:#16222b;--ink:#e6edf1;--muted:#9fb0bc;--line:#2a3a46;--accent:#3cc4b4;--accent-2:#f0a050;--lp:#ef6b5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161c;--panel:#16222b;--ink:#e6edf1;--muted:#9fb0bc;--line:#2a3a46;--accent:#3cc4b4;--accent-2:#f0a050;--lp:#ef6b5c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 20px;display:grid;gap:12px}
.cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.cab h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1;margin:0}
.cab p{margin:0;color:var(--muted)}
.cab .dato{flex-basis:100%;font-family:var(--f-mono);font-size:.82rem}
.cab .dato b{font-family:var(--f-display);font-size:1.25rem;color:var(--accent);font-variant-numeric:tabular-nums;margin-right:4px}
.app{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1080px){.app{grid-template-columns:230px minmax(0,600px) minmax(0,1fr);align-items:start}}
@media (min-width:760px) and (max-width:1079px){.app{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.lado{grid-column:1 / -1}}
.lado,.centro,.pasos{display:grid;gap:10px;align-content:start;min-width:0}
.lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lado .mano-sel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.lado .mano-sel .ct{width:100%}
.lado .mano-sel button{display:block;width:100%}
.lado .ctrl .btn{flex:1 1 auto}
@media (min-width:1080px){.lado .picker{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:760px) and (max-width:1079px){.lado .picker{grid-template-columns:repeat(9,minmax(0,1fr))}}
.cabmesa{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.pasos .pos{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
@media (min-width:1080px){.pasos ol.ev{max-height:calc(100vh - 150px)}}
.linea{display:flex;align-items:center;gap:10px}
.pista{position:relative;flex:1;min-width:0}
.pista input{width:100%;margin:0;display:block;accent-color:var(--accent);cursor:pointer}
.pista input:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px}
.marcas{position:relative;height:6px;margin-top:3px}
.marcas i{position:absolute;top:0;width:3px;height:6px;border-radius:1px;background:var(--lp);transform:translateX(-50%)}
.num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
footer{color:var(--muted);font-size:.8rem;max-width:90ch}

.repro{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:12px}
.repro .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.repro .mano-r{display:flex;flex-wrap:wrap;gap:6px}
.repro .mano-r .ct{width:58px}
.btn{font:600 .95rem var(--f-body);border:1px solid var(--accent);background:var(--accent);color:var(--bg);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .pos{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-width:0}
.res{font-family:var(--f-mono);font-size:.82rem;border-radius:999px;padding:3px 10px;border:1px solid var(--muted);color:var(--muted)}
.res.ok{border-color:var(--accent);color:var(--accent)}
.res.mal{border-color:var(--lp);color:var(--lp)}
.vista-r{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.vista-r{grid-template-columns:minmax(0,1fr)}}
.mesa-r{display:grid;gap:6px;min-width:0}
.fila-r{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:8px;align-items:center}
.fila-r .lab{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.zonas{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.ct{width:44px;flex:none;position:relative}
.ct img,.ct .v,.ct .nf{width:100%;aspect-ratio:59/86;border-radius:3px;display:block}
.ct .v{border:1px dashed var(--line)}
.ct .nf{border:1px solid var(--accent-2);background:var(--bg);font-size:.5rem;line-height:1.05;padding:2px;overflow:hidden;color:var(--ink);display:grid;place-items:center;text-align:center}
.ct.abajo img,.ct.abajo .nf{filter:grayscale(1) brightness(.55)}
.ct.riv img,.ct.riv .nf{outline:2px solid var(--lp)}
.ct.cad img,.ct.cad .nf{outline:2px solid var(--accent-2)}
.lps-r{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.lps-r b{color:var(--lp)}
ol.ev{margin:0;padding:0 0 0 1.6em;max-height:420px;overflow:auto;font-size:.86rem;border-left:1px solid var(--line)}
ol.ev li{padding:2px 4px;cursor:pointer;border-radius:3px}
ol.ev li.on{background:var(--accent);color:var(--bg)}
ol.ev li.dano{color:var(--lp);font-weight:700}
ol.ev li.on.dano{color:var(--bg)}
ol.ev li.res-ev{color:var(--muted)}
@media (max-width:520px){.fila-r{grid-template-columns:4rem minmax(0,1fr);gap:6px}.fila-r .lab{font-size:.6rem}.ct{width:36px}.zonas{gap:3px}.repro{padding:10px}}

.arma{display:grid;gap:14px}
.sel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.mano-sel{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.mano-sel .ct{width:58px}
.mano-sel button{all:unset;cursor:pointer;border-radius:3px}
.mano-sel button:focus-visible,.pk:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.pk{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:3px;min-width:0;border-radius:4px;padding:3px;border:1px solid transparent}
.pk .ct{width:100%}
.pk.usa{border-color:var(--accent)}
.pk[aria-disabled="true"]{cursor:default;opacity:.38}
.pk .cnt{font-family:var(--f-mono);font-size:.72rem;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.pk.usa .cnt{color:var(--accent);font-weight:500}
.estado{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-height:1.3em}
.estado.mal{color:var(--lp)}

:root{--mat:#e4ecee;--zona:#b3c3cb;--pend:#c86a12;--dorso1:#7a5432;--dorso2:#4a311b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mat:#0f1b22;--zona:#2e4250;--pend:#f0a050}}
:root[data-theme="dark"]{--mat:#0f1b22;--zona:#2e4250;--pend:#f0a050}
.campo{display:grid;gap:6px;background:var(--mat);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.f7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.z{position:relative;aspect-ratio:59/86;max-width:100%;border:1px dashed var(--zona);border-radius:4px;display:grid;place-items:center;min-width:0}
.z.nada{border-color:transparent}
.z.pend{border-color:var(--pend);border-style:solid}
.z img,.z .nf,.z .dorso{width:100%;height:100%;border-radius:3px;display:block}
.z .nf{border:1px solid var(--accent-2);background:var(--bg);font-size:.5rem;line-height:1.05;padding:2px;overflow:hidden;color:var(--ink);display:grid;place-items:center;text-align:center}
.z.riv img,.z.riv .nf,.z.riv .dorso{transform:rotate(180deg)}
.z.abajo img,.z.abajo .nf{filter:grayscale(1) brightness(.55)}
.z.cad{outline:2px solid var(--accent-2);outline-offset:1px}
.z .zl{font-family:var(--f-mono);font-size:.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:1.15;padding:2px;overflow-wrap:anywhere}
.z .n{position:absolute;right:2px;bottom:2px;background:var(--panel);color:var(--ink);font:500 .62rem/1.3 var(--f-mono);border-radius:3px;padding:0 3px;font-variant-numeric:tabular-nums}
.dorso{background:radial-gradient(ellipse 34% 26% at 50% 50%,var(--dorso1) 0 60%,transparent 62%),repeating-linear-gradient(45deg,var(--dorso1) 0 3px,var(--dorso2) 3px 6px);border:2px solid var(--dorso2);box-sizing:border-box}
.medio{border-top:1px solid var(--zona);border-bottom:1px solid var(--zona);padding-block:5px}
.manof{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;min-height:1rem}
.manof .ct{width:min(15%,62px)}
.manof.riv .ct{width:min(8%,30px)}
.manof.riv .dorso{transform:rotate(180deg)}
.ct .dorso{width:100%;aspect-ratio:59/86;border-radius:3px;display:block}
.ct.cad img,.ct.cad .nf{outline:2px solid var(--accent-2)}
.lpf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lpf b{font-size:1rem;color:var(--ink)}
.lpf b.bajo{color:var(--lp)}
.pilas{display:grid;gap:4px}
.pilas .fila-r .ct{width:34px}
.vista-r{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
ol.ev{max-height:min(75vh,680px)}
@media (max-width:760px){.vista-r{grid-template-columns:minmax(0,1fr)}ol.ev{max-height:360px}}
@media (max-width:520px){.campo{padding:6px;gap:4px}.f7{gap:3px}.z .zl{font-size:.42rem}.z .n{font-size:.55rem}}
</style>

<div class="wrap">
<header class="cab"><h1>Power Patron FTK Bot</h1><p>Pick five cards and watch the bot play them.</p></header>
<main class="app" id="repro">
  <aside class="lado" aria-label="Your hand">
    <div class="lab">Your hand</div>
    <div class="mano-sel" id="m-sel" aria-label="Your hand (tap a card to remove it)"></div>
    <div class="ctrl">
      <button class="btn" id="m-azar" type="button">Random hand</button>
      <button class="btn sec" id="m-vaciar" type="button">Clear</button>
      <button class="btn" id="m-jugar" type="button" hidden>Watch it play</button>
    </div>
    <div class="estado" id="m-estado" aria-live="polite"></div>
    <div class="lab">Deck</div>
    <div class="picker" id="m-picker" aria-label="Deck cards"></div>
  </aside>
  <section class="centro" aria-label="Field">
    <div class="cabmesa">
      <div class="ctrl"><span class="res" id="r-res"></span><span class="res" id="r-res2" hidden title="If the bot knows the opponent holds Infinite Impermanence, it has a line that still wins wherever Imperm is used."></span></div>
      <div class="ctrl">
        <button class="btn sec" id="r-ant" type="button" aria-label="Previous step">Back</button>
        <button class="btn" id="r-play" type="button">Play</button>
        <button class="btn sec" id="r-sig" type="button" aria-label="Next step">Next</button>
        <button class="btn sec" id="r-fin" type="button">End</button>
        <button class="btn sec" id="r-vel" type="button" aria-label="Speed">1x</button>
      </div>
    </div>
    <div class="linea">
      <div class="pista">
        <input type="range" id="r-barra" min="0" max="0" value="0" step="1" aria-label="Move through the duel">
        <div class="marcas" id="r-marcas" aria-hidden="true"></div>
      </div>
      <span class="num" id="r-num"></span>
    </div>
    <div class="mano-r" id="r-mano" hidden></div>
    <div class="mesa-r" id="r-mesa"></div>
  </section>
  <section class="pasos" aria-label="Plays">
    <div class="pos" id="r-pos" aria-live="polite"></div>
    <ol class="ev" id="r-ev"></ol>
  </section>
</main>
<footer>Dio Branded</footer>
</div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const n = DECK.length, cop = DECK.map(d => d[1]);
const N = Array.from({length: n + 1}, () => [0, 0, 0, 0, 0, 0]);
N[n][0] = 1;
for (let i = n - 1; i >= 0; i--) for (let r = 0; r <= 5; r++) { let s = 0; for (let v = 0; v <= Math.min(cop[i], r); v++) s += N[i + 1][r - v]; N[i][r] = s; }
function rango(x) { let r = 5, k = 0; for (let i = 0; i < n; i++) { for (let v = 0; v < x[i]; v++) k += N[i + 1][r - v]; r -= x[i]; } return k; }
const total = x => x.reduce((a, b) => a + b, 0);
const nom = c => NOMBRES[String(c)] || String(c);

let sel = DECK.map(() => 0), E = null, i = 0, timer = null, pedido = 0, vi = 0;
const VEL = [900, 450, 220], REDUCIDO = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const cache = new Map();

function ct(code, o) {
  o = o || {};
  if (!code) return '<div class="ct"><div class="v"></div></div>';
  const abajo = code < 0, c = String(Math.abs(code)), nm = nom(c);
  const cls = "ct" + (abajo ? " abajo" : "") + (o.riv ? " riv" : "") + (o.cad ? " cad" : "");
  const cuerpo = FOTOS[c] ? '<img src="' + FOTOS[c] + '" alt="' + esc(nm) + (abajo ? ' (face-down)' : '') + '" title="' + esc(nm) + '">' : '<div class="nf" title="' + esc(nm) + '">' + esc(nm) + '</div>';
  return '<div class="' + cls + '">' + cuerpo + '</div>';
}
function tira(xs) { return (xs || []).length ? xs.map(c => ct(c)).join("") : '<span class="nota">empty</span>'; }
function fila(lab, html) { return '<div class="fila-r"><span class="lab">' + lab + '</span><div class="zonas">' + html + '</div></div>'; }
const DORSO = '<div class="dorso" role="img" aria-label="face-down card"></div>';
function zona(code, o) {
  o = o || {};
  let cls = "z" + (o.pend ? " pend" : "") + (o.nada ? " nada" : "");
  if (!code) return '<div class="' + cls + '">' + (o.lab ? '<span class="zl">' + o.lab + '</span>' : '') + '</div>';
  const abajo = code < 0, c = String(Math.abs(code)), nm = nom(c);
  cls += (o.riv ? " riv" : "") + (abajo ? " abajo" : "") + (o.enCad && o.enCad.has(Math.abs(code)) ? " cad" : "");
  const t = esc(nm) + (abajo ? " (face-down)" : "") + (o.lab ? " · " + o.lab : "");
  const cuerpo = FOTOS[c] ? '<img src="' + FOTOS[c] + '" alt="' + t + '" title="' + t + '">' : '<div class="nf" title="' + t + '">' + esc(nm) + '</div>';
  return '<div class="' + cls + '">' + cuerpo + (o.n ? '<span class="n">' + o.n + '</span>' : '') + '</div>';
}
function pila(xs, lab, enCad) { xs = xs || []; return xs.length ? zona(xs[xs.length - 1], {lab: lab, n: xs.length, enCad: enCad}) : zona(0, {lab: lab}); }
function mazo(lab, riv) { return '<div class="z' + (riv ? ' riv' : '') + '" title="' + lab + '">' + DORSO + '</div>'; }
function mesa(p) {
  if (!p.y) return '<p class="nota">No board snapshot for this hand; the list on the right has every play.</p>';
  const y = p.y || [], ys = p.ys || [], r = p.r || [], rs = p.rs || [];
  const enCad = new Set((p.c || []).map(x => Math.abs(x[0])));
  const R = (c, lab) => zona(c, {riv: true, lab: lab, enCad: enCad}), Y = (c, o) => zona(c, Object.assign({enCad: enCad}, o || {}));
  const lp = (v, quien) => '<span>' + quien + ' <b class="' + (v != null && v < 8000 ? "bajo" : "") + '">' + (v == null ? "?" : v) + '</b> LP</span>';
  let h = '<div class="campo" aria-label="Duel field">';
  h += '<div class="lpf">' + lp(p.lp, "Opponent") + '<span>' + (p.rh || 0) + ' in hand</span></div>';
  h += '<div class="manof riv">' + Array.from({length: p.rh || 0}, () => '<div class="ct">' + DORSO + '</div>').join("") + '</div>';
  h += '<div class="f7">' + mazo("Opponent's Extra Deck", true) + [4, 3, 2, 1, 0].map(k => zona(rs[k], {riv: true, pend: k === 0 || k === 4, enCad: enCad})).join("") + mazo("Opponent's Deck", true) + '</div>';
  h += '<div class="f7">' + zona(0, {lab: "GY"}) + [4, 3, 2, 1, 0].map(k => R(r[k])).join("") + R(rs[5], "Field") + '</div>';
  const ezL = y[5] ? Y(y[5], {lab: "Extra Zone"}) : r[6] ? R(r[6], "Extra Zone") : zona(0, {lab: "Extra Zone"});
  const ezR = y[6] ? Y(y[6], {lab: "Extra Zone"}) : r[5] ? R(r[5], "Extra Zone") : zona(0, {lab: "Extra Zone"});
  const nada = zona(0, {nada: true});
  h += '<div class="f7 medio">' + nada + nada + ezL + nada + ezR + nada + ((p.yb || []).length ? pila(p.yb, "Banished", enCad) : nada) + '</div>';
  h += '<div class="f7">' + Y(ys[5], {lab: "Field"}) + [0, 1, 2, 3, 4].map(k => Y(y[k])).join("") + pila(p.yg, "GY", enCad) + '</div>';
  h += '<div class="f7">' + ((p.yx || []).length ? pila(p.yx, "Extra", enCad) : mazo("Extra Deck")) + [0, 1, 2, 3, 4].map(k => Y(ys[k], {pend: k === 0 || k === 4, lab: k === 0 || k === 4 ? "Scale" : ""})).join("") + mazo("Deck") + '</div>';
  h += '<div class="manof">' + (p.yh || []).map(c => ct(c, {cad: enCad.has(Math.abs(c))})).join("") + '</div>';
  h += '<div class="lpf">' + lp(p.ylp, "Bot") + '<span>' + (p.yh || []).length + ' in hand</span></div>';
  h += '</div>';
  let d = "";
  if ((p.yg || []).length) d += fila("graveyard", tira(p.yg));
  if ((p.yx || []).length) d += fila("extra face-up", tira(p.yx));
  if ((p.yb || []).length) d += fila("banished", tira(p.yb));
  return h + (d ? '<div class="pilas">' + d + '</div>' : '');
}
function claseEv(t) { return t.indexOf("damage") >= 0 ? "dano" : t.trim().indexOf("chain link") === 0 ? "res-ev" : ""; }

function codigosDe(x) { const out = []; x.forEach((v, k) => { for (let j = 0; j < v; j++) out.push(DECK[k][0]); }); return out; }
function pintarSel() {
  const cs = codigosDe(sel);
  let h = "";
  cs.forEach(c => { h += '<button type="button" data-c="' + c + '" aria-label="Remove ' + esc(nom(c)) + ' from your hand">' + ct(c) + '</button>'; });
  for (let j = cs.length; j < 5; j++) h += ct(0);
  $("m-sel").innerHTML = h;
  const lleno = total(sel) >= 5;
  $("m-picker").innerHTML = DECK.map((d, k) => {
    const no = lleno || sel[k] >= d[1];
    return '<button type="button" class="pk' + (sel[k] ? " usa" : "") + '" data-k="' + k + '" aria-disabled="' + no + '" aria-label="Add ' + esc(nom(d[0])) + ' (' + sel[k] + ' of ' + d[1] + ' in your hand)">' + ct(d[0]) + '<span class="cnt">' + sel[k] + '/' + d[1] + '</span></button>';
  }).join("");
  $("m-jugar").disabled = total(sel) !== 5;
  if (total(sel) < 5) estado(total(sel) ? "Pick " + (5 - total(sel)) + " more." : "Pick five cards or draw a random hand.");
}
function estado(t, mal) { const e = $("m-estado"); e.textContent = t; e.classList.toggle("mal", !!mal); }
$("m-picker").onclick = e => {
  const b = e.target.closest(".pk"); if (!b || b.getAttribute("aria-disabled") === "true") return;
  sel[+b.dataset.k]++; pintarSel(); if (total(sel) === 5) jugar();
};
$("m-sel").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const k = DECK.findIndex(d => String(d[0]) === b.dataset.c); if (k >= 0 && sel[k]) { sel[k]--; pintarSel(); }
};
$("m-vaciar").onclick = () => { sel = DECK.map(() => 0); pintarSel(); };
$("m-azar").onclick = () => {
  const mazo = []; DECK.forEach((d, k) => { for (let j = 0; j < d[1]; j++) mazo.push(k); });
  for (let j = 0; j < 5; j++) { const t = j + Math.floor(Math.random() * (mazo.length - j)); const a = mazo[j]; mazo[j] = mazo[t]; mazo[t] = a; }
  sel = DECK.map(() => 0); for (let j = 0; j < 5; j++) sel[mazo[j]]++;
  pintarSel(); jugar();
};
$("m-jugar").onclick = jugar;

async function archivo(s) {
  if (cache.has(s)) return cache.get(s);
  const pr = (async () => {
    const r = await fetch("p/" + String(s).padStart(3, "0") + ".txt");
    if (!r.ok) throw new Error("file " + s + ": " + r.status);
    const b64 = (await r.text()).trim();
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const flujo = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(flujo).text());
  })();
  cache.set(s, pr);
  pr.catch(() => cache.delete(s));
  return pr;
}
async function jugar(auto) {
  if (total(sel) !== 5) return;
  if (typeof DecompressionStream === "undefined") { estado("This browser is too old to open the duels. Try an up-to-date one.", true); return; }
  const x = sel.slice(), k = rango(x), yo = ++pedido;
  estado("Loading this hand's duel...");
  try {
    const arr = await archivo(Math.floor(k / K));
    if (yo !== pedido) return;
    const e = arr[k % K];
    if (!e) { estado("This hand could not be played. Try another one.", true); return; }
    cargar(e, codigosDe(x), auto !== false);
    estado("");
  } catch (err) {
    if (yo === pedido) estado("Could not load the duel (" + (err && err.message || err) + "). Check your connection and try again.", true);
  }
}

function pintar() {
  const p = E.pasos[i];
  $("r-mesa").innerHTML = mesa(p);
  $("r-pos").textContent = "step " + (i + 1) + " of " + E.pasos.length + ": " + p.t.trim();
  const lis = $("r-ev").children;
  for (let j = 0; j < lis.length; j++) lis[j].classList.toggle("on", j === i);
  const on = lis[i], ol = $("r-ev");
  if (on) ol.scrollTop = Math.max(0, on.offsetTop - ol.offsetTop - ol.clientHeight / 2);
  $("r-barra").value = i; $("r-num").textContent = (i + 1) + " / " + E.pasos.length;
  $("r-ant").disabled = i === 0;
  $("r-sig").disabled = i === E.pasos.length - 1;
}
function parar() { if (timer) { clearInterval(timer); timer = null; } $("r-play").textContent = "Play"; }

const TR = [
  [/^Yo activa (.*)$/, "Bot activates $1"],
  [/^Yo invoca (.*) \(especial\)$/, "Bot Special Summons $1"],
  [/^Yo invoca (.*)$/, "Bot Normal Summons $1"],
  [/^Yo busca (.*)$/, "Bot adds $1 to the hand"],
  [/^Yo coloca (.*)$/, "Bot Sets $1"],
  [/^Rival activa (.*)$/, "Opponent activates $1"],
  [/^Rival invoca (.*) \(especial\)$/, "Opponent Special Summons $1"],
  [/^Rival invoca (.*)$/, "Opponent Normal Summons $1"],
  [/^(\s*)resuelve el eslabón (\d+): (.*) \(mío\)$/, "$1chain link $2 resolves: $3 (bot)"],
  [/^(\s*)resuelve el eslabón (\d+): (.*) \(del rival\)$/, "$1chain link $2 resolves: $3 (opponent)"],
  [/^(\s*)daño (\d+) a rival$/, "$1$2 damage to the opponent"],
  [/^(\s*)daño (\d+) a mi$/, "$1$2 damage to the bot"],
  [/^(\s*)\(negado\)$/, "$1(negated)"],
];
const tr = t => { for (const [re, s] of TR) if (re.test(t)) return t.replace(re, s); return t; };
function cargar(e, codes, auto) {
  parar(); i = 0;
  const pasos = (e.s || []).map(p => typeof p === "string" ? {t: tr(p)} : Object.assign({}, p, {t: tr(p.t)}));
  E = {pasos: pasos.length ? pasos : [{t: "The bot found no plays with this hand."}]};
  $("r-mano").innerHTML = codes.map(c => ct(c)).join("");
  const res = $("r-res");
  if (!e.f) { res.textContent = "No FTK"; res.className = "res mal"; }
  else { res.textContent = "FTK"; res.className = "res ok"; }
  const r2 = $("r-res2");
  if (r2) {
    if (e.fi === undefined) r2.hidden = true;
    else { r2.hidden = false; r2.textContent = e.ri ? "Beats Imperm" : "Imperm stops it"; r2.className = "res" + (e.ri ? " ok" : ""); }
  }
  $("r-ev").innerHTML = E.pasos.map((p, j) => '<li class="' + claseEv(p.t) + '" data-j="' + j + '">' + esc(p.t.trim()) + '</li>').join("");
  pintar()
  const ult = Math.max(1, E.pasos.length - 1), barra = $("r-barra");
  barra.max = E.pasos.length - 1; barra.value = 0;
  $("r-marcas").innerHTML = E.pasos.map((p, j) => p.t.indexOf("damage") >= 0 ? '<i style="left:calc(8px + (100% - 16px) * ' + (j / ult).toFixed(4) + ')"></i>' : "").join("");
  if (auto && !REDUCIDO) play();
}
function play() {
  if (!E) return;
  if (timer) { parar(); return; }
  if (i >= E.pasos.length - 1) i = 0;
  $("r-play").textContent = "Pause";
  timer = setInterval(() => { if (i < E.pasos.length - 1) { i++; pintar(); } else parar(); }, VEL[vi]);
}
$("r-play").onclick = play;
$("r-ant").onclick = () => { if (!E) return; parar(); if (i > 0) { i--; pintar(); } };
$("r-sig").onclick = () => { if (!E) return; parar(); if (i < E.pasos.length - 1) { i++; pintar(); } };
$("r-ev").onclick = e => { const li = e.target.closest("li"); if (li && E) { parar(); i = +li.dataset.j; pintar(); } };

INICIAL.forEach(c => { const k = DECK.findIndex(d => d[0] === c); if (k >= 0) sel[k]++; });
$("r-barra").addEventListener("input", ev => { if (!E) return; parar(); i = +ev.target.value; pintar(); });
$("r-fin").onclick = () => { if (!E) return; parar(); i = E.pasos.length - 1; pintar(); };
$("r-vel").onclick = () => { vi = (vi + 1) % VEL.length; $("r-vel").textContent = ["1x", "2x", "4x"][vi]; if (timer) { parar(); play(); } };
document.addEventListener("keydown", ev => {
  if (!E || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  const enBoton = ev.target && /^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
  if (ev.key === "ArrowRight") { ev.preventDefault(); $("r-sig").click(); }
  else if (ev.key === "Home") { ev.preventDefault(); parar(); i = 0; pintar(); }
  else if (ev.key === "End") { ev.preventDefault(); $("r-fin").click(); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); $("r-ant").click(); }
  else if (ev.key === " " && !enBoton) { ev.preventDefault(); play(); }
});
pintarSel(); jugar(false);
})();
</script>
